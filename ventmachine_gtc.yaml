# Конфигурация Установки Ventmachine с контроллером GTC Syberia 5
# Конфигурация Modbus
modbus:
- name: GTC
  type: tcp
  host: 192.168.4.184   # укажите IP адрес
  port: 22229           # укажите порт, порт по умолчанию 502
  delay: 5
  message_wait_milliseconds: 30
  timeout: 5
  sensors:
  
    - name: gtc_statе_0  # Текущее состояние установки State_0
      slave: 1
      address: 2
      input_type: input
      data_type: uint16
      
    - name: gtc_state_1  # Текущее состояние установки State_1
      slave: 1
      address: 3
      input_type: input
      data_type: uint16
      
    - name: gtc_error_code  # Текущие ошибки Error_Code
      slave: 1
      address: 4
      input_type: input
      data_type: uint16
      
    - name: gtc_error_code_1  # Текущие ошибки Error_Code_1
      slave: 1
      address: 5
      input_type: input
      data_type: uint16
      
    - name: gtc_current_temp   # Текущая температура установки внутри канала
      state_class: measurement
      device_class: temperature
      scan_interval: 10
      unit_of_measurement: °C
      precision: 1
      scale: 0.1
      address: 7
      input_type: input
      data_type: uint16
      
    - name: gtc_Filter_state  # Состояние загрязнения фильтра в %
      state_class: measurement
      unit_of_measurement: "%"
      slave: 1
      address: 14
      input_type: input
      data_type: uint16
      
    - name: gtc_current_fan_speed  # Текущая скорость вращения вентилятора
      state_class: measurement
      scan_interval: 10
      address: 25
      input_type: input
      data_type: uint16
      
    - name: gtc_target_temp  # Заданная температура установке
      state_class: measurement
      device_class: temperature
      scan_interval: 10
      unit_of_measurement: °C
      precision: 1
      scale: 0.1
      address: 31
      data_type: uint16
      
    - name: gtc_target_fan_speed  # Заданная скорость вращения вентилятора
      state_class: measurement
      scan_interval: 10
      slave: 1
      address: 32
      data_type: uint16
      
    - name: gtc_room_temp  #Температура комноты с пульта управления
      state_class: measurement
      device_class:  temperature
      scan_interval: 10
      unit_of_measurement: "°C"
      precision: 1
      scale: 0.1
      address: 57
      input_type: input
      data_type: uint16
      
    - name: gtc_room_humidity  #Влажность комноты с пульта управления
      state_class: measurement
      device_class: humidity
      unit_of_measurement: "%"
      scan_interval: 10
      address: 58
      input_type: input
      data_type: uint16
      
#      state_class: measurement
#      device_class: carbon_dioxide
#      unit_of_measurement: "ppm"
#      scan_interval: 10
#      address: 61
#      input_type: input
#      data_type: uint16
      
